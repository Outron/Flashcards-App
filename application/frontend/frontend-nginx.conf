upstream api-service {
    server flashcards-app-608033900383.europe-west1.run.app:8000;
}

server {
    listen 3000;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /api/ {
        proxy_pass https://flashcards-app-608033900383.europe-west1.run.app;
    }

    error_page   500 502 503 504  /50x.html;
        location = /50x.html {
        root   /usr/share/nginx/html;
    }

}