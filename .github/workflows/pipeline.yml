name: CI/CD Flashcards

on:
  workflow_dispatch:
    inputs:
      deploy-api:
        description: 'Build, test and deploy API service'
        required: true
        type: boolean

      deploy-frontend:
        description: 'Build, test and deploy Frontend service'
        required: true
        type: boolean

      api-version:
        description: 'Version of API image e.g. 1.0'
        required: true
        type: string

      frontend-version:
        description: 'Version of Frontend image e.g. 1.0'
        required: true
        type: string

      environment:
        description: 'Deployment environment'
        required: true
        type: environment

jobs:
  build_test_push_api:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    permissions:
      contents: 'read'
    if: ${{ github.event.inputs.deploy-api == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Auth to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_DEPLOY_SA }}
          token_format: 'access_token'

      - name: Login to Artifact Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{steps.auth.outputs.access_token}}

      - name: Build API Image
        run: docker build -t api:${{github.event.inputs.API-version}} -f Dockerfile-backend .

      - name: Run API Tests
        run: docker run --rm api:${{github.event.inputs.API-version}} /bin/bash -c "pytest  -v"

      - name: Push API Image to Registry
        run: |
          API_AR_TAG=${{vars.API_AR_URL}}/api:${{github.event.inputs.api-version}}
          docker tag api:${{github.event.inputs.api-version}} $API_AR_TAG
          docker push $API_AR_TAG

    outputs:
      api_image_url: ${{ vars.API_AR_URL }}/api:${{ github.event.inputs.api-version }}

  deploy_api:
    runs-on: ubuntu-latest
    needs: build_api
    environment: ${{ github.event.inputs.environment }}
    permissions:
      contents: 'read'
    if: ${{ github.event.inputs.deploy-api == 'true' }}

    steps:
      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Deploy API image to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ vars.API_SERVICE_NAME }}
          image: ${{ needs.build_test_push_api.outputs.api_image_url }}
          region: ${{ vars.GCP_REGION }}
          flags: --allow-unauthenticated --port=8000
          env_vars: |
            ENVIRONMENT=${{ github.event.inputs.environment }}
            MONGO_URI=${{ secrets.MONGO_URI }}

  build_frontend:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    permissions:
      contents: 'read'
    if: ${{ github.event.inputs.deploy-frontend == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Auth to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_DEPLOY_SA }}
          token_format: 'access_token'

      - name: Login to Artifact Registry
        uses:  docker/login-action@v2
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{steps.auth.outputs.access_token}}

      - name: Build Frontend Image
        run: docker build -t frontend:${{github.event.inputs.frontend-version}} -f Dockerfile-frontend .

#      - name: Run Frontend Tests
#        run: docker run --rm api:${{github.event.inputs.frontend-version}} /bin/bash -c "npm install && npm run test -- --watchAll=false"

      - name: Push Frontend Image to Registry
        run: |
          FRONTEND_AR_TAG=${{vars.FRONTEND_AR_URL}}/frontend:${{github.event.inputs.frontend-version}}
          docker tag frontend:${{github.event.inputs.frontend-version}} $FRONTEND_AR_TAG
          docker push $FRONTEND_AR_TAG

    outputs:
      frontend_image_url: ${{ vars.FRONTEND_AR_URL }}/frontend:${{ github.event.inputs.frontend-version }}

  deploy_frontend:
    runs-on: ubuntu-latest
    needs: build_test_push_frontend
    environment: ${{ github.event.inputs.environment }}
    permissions:
      contents: 'read'
    if: ${{ github.event.inputs.deploy-frontend == 'true' }}

    steps:
      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Deploy Frontend image to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ vars.FRONTEND_SERVICE_NAME }}
          image: ${{ needs.build_test_push_frontend.outputs.frontend_image_url }}
          region: ${{ vars.GCP_REGION }}
          flags: --allow-unauthenticated
          env_vars: |
            ENVIRONMENT=${{ github.event.inputs.environment }}
            API_URL_GCP=${{ vars.API_URL }}
