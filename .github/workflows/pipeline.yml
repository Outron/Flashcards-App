name: CI/CD Flashcards

on:
  workflow_dispatch:
    inputs:
      deploy-api:
        description: 'Build, test and deploy API service'
        required: true
        type: boolean

      deploy-frontend:
        description: 'Build, test and deploy Frontend service'
        required: true
        type: boolean

      api-version:
        description: 'Version of API image e.g. 1.0'
        required: true
        type: string

      frontend-version:
        description: 'Version of Frontend image e.g. 1.0'
        required: true
        type: string

      environment:
        description: 'Deployment environment'
        required: true
        type: environment

jobs:
  build_and_test_api:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    if: ${{ github.event.inputs.deploy-api == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build API Image
        run: docker build -t api:${{inputs.API-version}} -f Dockerfile-backend .

      - name: Run API Tests
        run: docker run --rm api:${{inputs.API-version}} /bin/bash -c "pytest  -v"


  push_api_image:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    needs: build_and_test_api
    permissions:
      contents: 'read'
    if: ${{ github.event.inputs.deploy-api == 'true' }}

    steps:
      - name: Auth to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_DEPLOY_SA }}
          token_format: 'access_token'

      - name: Login to Artifact Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{steps.auth.outputs.access_token}}

      - name: Push API Image to Registry
        run: |
          LOCAL_TAG=api:${{github.event.inputs.API-version}}
          FULL_TAG=${{ vars.API_AR_URL }}/api:${{github.event.inputs.API-version}}
          docker tag $LOCAL_TAG $FULL_TAG
          docker push $FULL_TAG
